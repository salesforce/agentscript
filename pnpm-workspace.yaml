packages:
  - 'packages/*'
  - 'dialect/*'
  - 'apps/*'

# Required for parser (native bindings)
onlyBuiltDependencies:
  - tree-sitter

overrides:
  vite: ^7.3.5
  # monaco-editor and monaco-vscode-api pin vulnerable dompurify 3.1.x / 3.3.x
  dompurify@<3.4.17: ^3.4.17
  # @tailwindcss/typography pins postcss-selector-parser 6.0.10 exactly
  postcss-selector-parser@6.0.10: ^6.1.6

# Block installs of packages published less than 1 day ago
minimumReleaseAge: 1440
